const SN=Object.keys(SY);let st=ld('chronos-syllabus',{}),op=ld('chronos-syllabus-open',{});
const kk=(s,g,i)=>s+'|'+g+'|'+i,cnt=s=>{let t=0,d=0;for(const g in SY[s])SY[s][g].forEach((_,i)=>{t++;if(st[kk(s,g,i)])d++});return[d,t]};
function renderSy(){const y=scrollY;let D=0,T=0;const cards=SN.map((s,si)=>{const[d,t]=cnt(s);D+=d;T+=t;const p=t?Math.round(d/t*100):0,o=op[s];
 return `<div class="sy-card glass-panel"><div class="sy-h" data-si="${si}"><div class="sy-hl"><b>${esc(s)}</b><span>${d}/${t} · ${p}%</span></div><span class="sy-chev">${o?'▾':'▸'}</span></div><div class="sy-bar"><i class="${p===100?'full':''}" style="width:${p}%"></i></div>${o?`<div class="sy-body">${Object.entries(SY[s]).map(([g,a],gi)=>`<div class="sy-g">${esc(g)}</div>`+a.map((x,i)=>`<div class="sy-it ${st[kk(s,g,i)]?'done':''}" data-si="${si}" data-g="${gi}" data-i="${i}"><span class="sy-cb">${st[kk(s,g,i)]?'✓':''}</span><span>${esc(x)}</span></div>`).join('')).join('')}<button class="glass-button sy-rs" data-rs="${si}">Reset subject</button></div>`:''}</div>`}).join('');
