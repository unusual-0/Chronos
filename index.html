/* =========================================================
   CHRONOS — quiet glass / soft neumorphic redesign

:root {

  --ink-muted: #738198;
  --accent-primary: #91aaff;
  --accent-gradient: linear-gradient(135deg, #9cb4ff 0%, #7894ed 100%);

  --shadow-dark: rgba(0, 0, 0, .34);

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-full: 999px;
  --spring-smooth: cubic-bezier(.2, .7, .2, 1);
  --speed-fast: .18s;
  --speed-normal: .26s;
  --nm-base: #151e2b;
  --nm-ink: #edf2fb;
  --nm-sd: rgba(0, 0, 0, .32);
  --nm-sl: rgba(255, 255, 255, .035);
  --nm-out: 9px 9px 22px var(--nm-sd), -7px -7px 20px var(--nm-sl);
  --nm-out-s: 4px 4px 10px var(--nm-sd), -4px -4px 10px var(--nm-sl);
  --nm-in: inset 7px 7px 16px rgba(0, 0, 0, .24), inset -6px -6px 15px rgba(255, 255, 255, .025);
  --nm-in-s: inset 3px 3px 8px rgba(0, 0, 0, .25), inset -3px -3px 8px rgba(255, 255, 255, .025);
}

[data-theme="light"] {
  color-scheme: light;
  --bg-base: #e9eef6;
  --surface: rgba(255, 255, 255, .68);
  --surface-strong: rgba(250, 252, 255, .92);
  --surface-soft: rgba(255, 255, 255, .42);
  --line: rgba(67, 86, 120, .10);
  --line-strong: rgba(67, 86, 120, .16);

  --ink-soft: #526078;

  --accent-primary: #647fda;
  --accent-gradient: linear-gradient(135deg, #7893e8 0%, #5d78ce 100%);
  --accent-glow: rgba(89, 119, 211, .16);

  --shadow-light: rgba(255, 255, 255, .9);

  --nm-out-s: 4px 4px 10px var(--nm-sd), -4px -4px 10px var(--nm-sl);
  --nm-in: inset 7px 7px 16px rgba(143, 156, 180, .23), inset -6px -6px 15px rgba(255, 255, 255, .85);
  --nm-in-s: inset 3px 3px 8px rgba(143, 156, 180, .22), inset -3px -3px 8px rgba(255, 255, 255, .85);

  font-size: .9rem;
  transition: border-color var(--speed-fast), box-shadow var(--speed-fast);
}
.glass-input::placeholder { color: var(--ink-muted); }
.glass-input:focus, .cx-sel:focus { border-color: rgba(139,164,255,.55) !important; box-shadow: var(--nm-in-s), 0 0 0 3px var(--accent-glow) !important; }
.cx-sel { width: auto; max-width: 220px; }
.cx-sel option { color: var(--ink); background: var(--surface-strong); }
input[type="range"] { accent-color: var(--accent-primary); }

/* World clock */
.world-container {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(290px, .92fr);
  align-items: start;
  gap: 20px;
}
.local-hero-card {

  grid-row: 1 / span 2;
  display: flex;

  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 34px 24px;
  text-align: center;
}
.local-city { color: var(--ink-muted); font-size: .76rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
.analog-clock-container { width: clamp(154px, 18vw, 204px); height: clamp(154px, 18vw, 204px); margin: 14px 0 8px; }
.analog-dial {
  position: relative;

  border: 1px solid var(--line-strong) !important;
  border-radius: 50%;

  box-shadow: var(--nm-in) !important;
}

}
.analog-hand { z-index: 2; border-radius: 99px; transform-origin: bottom center; }
.hand-hour, .hand-minute { background: var(--ink) !important; }
.hand-second { background: var(--accent-primary) !important; }
.analog-pin { z-index: 4; width: 8px; height: 8px; background: var(--accent-primary) !important; box-shadow: 0 0 0 4px var(--nm-base); }
.local-time {

  background: none !important;
  -webkit-text-fill-color: currentColor !important;

  line-height: 1.08;
  white-space: nowrap;
}
.local-date { margin-top: 4px; color: var(--ink-muted); font-size: .87rem; }
.section-header { grid-column: 2; grid-row: 1; align-self: end; margin: 0 0 0; min-height: 48px; }
.cities-grid { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: minmax(0,1fr); gap: 11px; }
.city-card {
  display: flex;

  gap: 14px;
  padding: 18px 20px;

}
.city-info { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
.city-offset { color: var(--ink-muted); font-family: "JetBrains Mono", monospace; font-size: .68rem; letter-spacing: .03em; }
.city-name { color: var(--ink); font-size: .95rem; font-weight: 700; }
.city-time-wrap { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.city-time { color: var(--ink); font-size: clamp(1.15rem, 2vw, 1.55rem); font-weight: 600; letter-spacing: -.055em; }
.city-period { color: var(--ink-muted); font-size: .7rem; font-weight: 750; }
.city-delete-btn {
  position: absolute;
  top: 9px; right: 9px;
  display: grid;
  width: 25px; height: 25px;
  place-items: center;
  color: var(--ink-muted);
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: 8px;
  opacity: 0;

  transition: opacity var(--speed-fast), color var(--speed-fast);
}
.city-card:hover .city-delete-btn, .city-delete-btn:focus-visible { opacity: 1; }
.city-delete-btn:hover { color: #e88b91; }

/* Alarms */
.alarms-view-wrapper { width: 100%; max-width: 900px; margin: 0 auto; }
.alarms-view-wrapper .section-header { display: flex; margin: 0 0 22px; }
.alarm-list { display: flex; flex-direction: column; gap: 12px; }
.alarm-card {
  display: flex;
  min-height: 118px;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 22px 24px;
  border-radius: 21px;
}
.alarm-card.disabled { opacity: .52; }
.alarm-info { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
.alarm-time-wrap { display: flex; align-items: baseline; gap: 8px; }
.alarm-time { color: var(--ink); font-size: clamp(1.8rem, 4vw, 2.45rem); font-weight: 650; letter-spacing: -.075em; }
.alarm-ampm { color: var(--ink-muted); font-size: .8rem; font-weight: 700; }
.alarm-label { color: var(--ink-soft); font-size: .88rem; }
.alarm-days { color: var(--ink-muted); font-size: .72rem; }
.alarm-actions { display: flex; align-items: center; gap: 14px; }
.glass-switch { position: relative; display: inline-block; width: 46px; height: 27px; flex: 0 0 46px; }
.glass-switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.switch-slider { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 99px; background: var(--nm-base) !important; box-shadow: var(--nm-in-s) !important; cursor: pointer; transition: background var(--speed-fast); }
.switch-slider::before { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #99a6bb; box-shadow: 2px 2px 5px rgba(0,0,0,.2); transition: transform var(--speed-fast), background var(--speed-fast); }
.glass-switch input:checked + .switch-slider { background: rgba(119,148,229,.2) !important; border-color: rgba(143,166,242,.28); }
.glass-switch input:checked + .switch-slider::before { background: var(--accent-primary); transform: translateX(19px); }

/* Stopwatch and countdown */
#view-stopwatch.active::before, #view-timer.active::before, #view-focus.active::before {
  display: block;
  margin: 0 auto 18px;
  color: var(--ink);
  font-size: 1.5rem;
  font-weight: 750;
  letter-spacing: -.055em;
  text-align: center;
}
#view-stopwatch.active::before { content: "Stopwatch"; }
#view-timer.active::before { content: "Countdown timer"; }
#view-focus.active::before { content: "Focus session"; }
.counter-stage {
  display: flex;
  width: 100%;
  min-height: min(690px, calc(100vh - 205px));
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px 18px 32px;
  border: 1px solid var(--line) !important;
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  box-shadow: 12px 14px 34px rgba(0,0,0,.12), inset 0 1px rgba(255,255,255,.035);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.ring-wrapper {
  position: relative;
  display: flex;
  width: min(390px, 58vw, 45vh);
  height: min(390px, 58vw, 45vh);
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line) !important;
  border-radius: 50%;
  background: var(--nm-base) !important;

}
.ring-wrapper::after { content: ""; position: absolute; inset: 10%; z-index: 1; border-radius: 50%; box-shadow: var(--nm-in); pointer-events: none; }
.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(128,145,174,.17); stroke-width: 7; }
.ring-progress { fill: none; stroke: var(--accent-primary); stroke-width: 7; stroke-linecap: round; filter: none !important; transition: stroke-dashoffset .12s linear, stroke var(--speed-normal); }
.counter-center-text { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; }
.counter-digits { color: var(--ink) !important; background: none !important; -webkit-text-fill-color: currentColor !important; font-size: clamp(2.6rem, 7vw, 4.35rem); font-weight: 600; letter-spacing: -.09em; line-height: 1.08; }
.counter-sub { margin-top: 8px; color: var(--ink-muted); font-size: .78rem; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
.counter-controls { display: flex; align-items: center; justify-content: center; gap: 13px; margin-top: 28px; }
.counter-controls .glass-button { min-width: 104px; min-height: 46px; }
.counter-controls .icon-btn { width: 46px; height: 46px; }
.laps-container { display: flex; width: min(620px, 100%); flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin: 12px auto 0; padding: 4px; }
.lap-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; color: var(--ink-soft); background: var(--surface-soft) !important; border: 1px solid var(--line) !important; border-radius: 13px; font-size: .82rem; }
.lap-item.fastest { color: #55c69b; }
.lap-item.slowest { color: #db9298; }
.timer-presets { display: grid; width: min(520px, 100%); grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-top: 24px; }
.preset-chip { min-height: 39px; padding: 0 10px; border-radius: 12px; }
.timer-custom { max-width: 500px !important; margin-top: 15px !important; }
.timer-custom .glass-input { min-width: 0; text-align: center; }

/* Focus / Pomodoro */
#view-focus .nm {
  display: flex;
  width: 100%;
  max-width: 1000px;
  flex-direction: column;
  gap: 22px;
  margin: 0 auto;
  padding: 26px;
  border: 1px solid var(--line) !important;
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  box-shadow: 12px 14px 34px rgba(0,0,0,.12), inset 0 1px rgba(255,255,255,.035);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
#view-focus .nm-tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
#view-focus .nm-tile {
  display: flex;

  padding: 24px 16px;

  border-radius: 21px;

}

  border-color: rgba(143,166,242,.28) !important;
  background: linear-gradient(145deg, rgba(133,157,235,.115), rgba(255,255,255,.018)) !important;
  box-shadow: inset 0 1px rgba(255,255,255,.06), 0 10px 26px rgba(0,0,0,.12) !important;
}
#view-focus .nm-lbl { color: var(--ink-muted); font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
#view-focus .nm-dial { position: relative; width: min(176px, 22vh); height: min(176px, 22vh); border-radius: 50%; background: var(--nm-base); box-shadow: var(--nm-in); }
#view-focus .nm-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
#view-focus .nm-ring-p { fill: none; stroke: rgba(126,145,180,.16); stroke-width: 6; }
#view-focus .nm-tile.active .nm-ring-p { stroke: var(--accent-primary); stroke-dasharray: 565.48; stroke-linecap: round; filter: none; }
#view-focus .nm-ico { position: absolute; inset: 0; width: 30px; height: 30px; margin: auto; color: var(--ink-muted); }
#view-focus .nm-tile.active .nm-ico { color: var(--accent-primary); }
#view-focus .nm-time { color: var(--ink); font-family: "JetBrains Mono", monospace; font-size: clamp(1.45rem, 3vw, 2rem); font-weight: 600; letter-spacing: -.07em; }
#view-focus .nm-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
#view-focus .nm-cap { padding: 6px 11px; color: var(--ink-soft); background: var(--surface-soft); border: 1px solid var(--line); border-radius: 99px; font-size: .7rem; font-weight: 650; }
#view-focus .nm-dots { display: flex; align-items: center; gap: 6px; }
#view-focus .nm-dots i { display: block; width: 7px; height: 7px; border-radius: 50%; background: rgba(145,160,188,.25); }
#view-focus .nm-dots i.done { background: #64c69e; }
#view-focus .nm-dots i.cur { width: 19px; border-radius: 99px; background: var(--accent-primary); }
#view-focus .nm-ctrl { display: flex; align-items: center; justify-content: center; gap: 11px; }
#view-focus .nm-btn {
  display: inline-flex;
  min-width: 48px;
  height: 48px;
  align-items: center;
  justify-content: center;
  padding: 0 13px;
  color: var(--ink-soft);
  background: var(--nm-base);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: var(--nm-out-s);

  transition: box-shadow var(--speed-fast), transform var(--speed-fast), color var(--speed-fast);
}
#view-focus .nm-btn:active { box-shadow: var(--nm-in-s); transform: scale(.98); }
#view-focus .nm-btn.nm-main { min-width: 156px; height: 50px; padding: 0 28px; color: #f8faff; background: var(--accent-gradient); border-color: rgba(255,255,255,.2); box-shadow: 0 8px 22px var(--accent-glow); font-weight: 750; }
#view-focus .nm-btn.nm-main.on { filter: saturate(.82); }
#view-focus .nm-noise { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-top: 18px; border-top: 1px solid var(--line); }
#view-focus .nm-lbl.sm { margin-right: auto; color: var(--ink-muted); font-size: .68rem; }
#view-focus .nm-seg { display: flex; flex-wrap: wrap; gap: 6px; }
#view-focus .nm-seg button { min-height: 33px; padding: 0 12px; color: var(--ink-muted); background: var(--nm-base); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--nm-out-s); font-size: .7rem; cursor: pointer; }
#view-focus .nm-seg button.on { color: var(--accent-primary); box-shadow: var(--nm-in-s); }
#view-focus .nm-range { width: 110px; }

/* Syllabus overview and checklist */
#view-syllabus { max-width: 1100px; margin: 0 auto; }
#view-syllabus::before { content: "HSC 2027"; display: block; margin: 0 0 5px; color: var(--ink-muted); font-size: .68rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.sy-top { display: flex; align-items: center; gap: 24px; margin-bottom: 18px; padding: 22px 26px; }
.sy-top .section-title { font-size: 1.3rem; }
.sy-sub { margin-top: 4px; color: var(--ink-muted); font-size: .82rem; }
.sy-card { overflow: hidden; margin-bottom: 11px; border-radius: 17px; }

.sy-hl { display: flex; min-width: 0; flex-direction: column; gap: 3px; }

.sy-body { padding: 0 18px 17px; }
.sy-g { margin: 16px 0 7px; color: var(--ink-muted); font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.sy-it {

.sy-cb { display: grid; width: 17px; height: 17px; flex: 0 0 17px; place-items: center; margin-top: 2px; color: transparent; background: var(--nm-base); border: 1px solid var(--line-strong); border-radius: 5px; box-shadow: var(--nm-in-s); font-size: .68rem; }

.sy-rs { margin-top: 13px; min-height: 34px; color: var(--ink-muted) !important; font-size: .7rem; }

/* Dialogs and settings */

.city-select-list { display: flex; max-height: 300px; flex-direction: column; gap: 7px; overflow-y: auto; }

/* Mini floating timer */
.mini-widget {
  position: fixed;
  z-index: 9999;
  right: 22px;
  bottom: 22px;
  display: none;
  width: 170px;
  height: 170px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  background: var(--surface-strong) !important;
  border: 1px solid var(--line-strong) !important;
  border-radius: 50%;
  box-shadow: var(--nm-out) !important;

.mini-widget .mini-label { color: var(--ink-muted); font-size: .65rem; letter-spacing: .11em; text-transform: uppercase; }

/* Music module styles retained and brought into the same design language. */
